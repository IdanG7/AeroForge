pipeline:
  input:
    type: webcam
    device: 0
    size:
      width: 1280
      height: 720
      fps: 30

  # PyTracking handles detection + tracking internally
  # Just need estimator and controller
  modules:
    # Optional deep-learning tracker running in a Python subprocess (Windows only for
    # now). Needs the setup described in PYTRACKING_INTEGRATION.md. Without this module
    # the built-in C++ tracker is used.
    - name: detector
      type: pytracking
      params:
        wrapper_path: python/pytracking_wrapper.py
        tracker_name: dimp
        python_cmd: python

    - name: estimator
      type: size_based
      params:
        object_diameter_m: 0.20
        fx: 920.0
        fy: 920.0
        cx: 640.0
        cy: 360.0

    - name: controller
      type: pid_velocity
      params:
        desired_offset_m: [-3.0, 0.0, 0.0]
        kp: [0.8, 0.8, 0.6]
        ki: [0.0, 0.0, 0.0]
        kd: [0.1, 0.1, 0.08]
        max_speed_mps: 3.0

  sinks:
    - type: hud
      params:
        draw_bbox: true
        show_fps: true

safety:
  require_hold_to_enable: true
  e_stop_key: "SPACE"
  limits:
    max_speed_mps: 6.0
    min_follow_dist_m: 2.0
    max_follow_dist_m: 10.0
  geofence:
    min_alt_m: 3.0
    max_alt_m: 60.0
